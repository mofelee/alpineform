name: Release dry-run

on:
  push:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - "Makefile"
      - "scripts/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "*.md"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - "NOTICE.md"
      - "NOTICE.zh-CN.md"
      - "SECURITY.md"
      - "SECURITY.zh-CN.md"
      - "CHANGELOG.md"
      - "CHANGELOG.zh-CN.md"
      - "docs/**"
      - "examples/**"
      - "test/release/**"
  pull_request:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - "Makefile"
      - "scripts/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "*.md"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - "NOTICE.md"
      - "NOTICE.zh-CN.md"
      - "SECURITY.md"
      - "SECURITY.zh-CN.md"
      - "CHANGELOG.md"
      - "CHANGELOG.zh-CN.md"
      - "docs/**"
      - "examples/**"
      - "test/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check GitHub attestation eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          APF_PRIVATE_ATTESTATIONS_ENABLED: ${{ vars.APF_PRIVATE_ATTESTATIONS_ENABLED }}
        run: scripts/check-attestation-eligibility.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install GoReleaser
        env:
          GORELEASER_VERSION: 2.16.0
        run: |
          cd "${RUNNER_TEMP}"
          archive="goreleaser_Linux_x86_64.tar.gz"
          base_url="https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}"
          curl --fail --location --retry 3 --show-error --silent --output "$archive" "$base_url/$archive"
          curl --fail --location --retry 3 --show-error --silent --output checksums.txt "$base_url/checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" goreleaser
          install -D -m 0755 goreleaser "${HOME}/.local/bin/goreleaser"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Run repository and installer gates
        run: |
          make check
          make vulncheck
          make test-installer
      - name: Check GoReleaser config
        run: goreleaser check
      - name: Build snapshot release
        run: goreleaser release --snapshot --clean --skip publish
      - name: Verify snapshot artifacts
        run: |
          test -s dist/checksums.txt
          python3 scripts/check-docs.py --list-package-files > "${RUNNER_TEMP}/documentation-package-files.txt"
          cmp scripts/documentation-package-files.txt "${RUNNER_TEMP}/documentation-package-files.txt"
          scripts/check-documentation-package.sh snapshot dist
          (cd dist && sha256sum --check checksums.txt)
